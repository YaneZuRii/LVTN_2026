<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NNKH — Không âm thanh - không khoảng cách</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="shell">
  <header class="header">
    <div class="logo" aria-hidden="true">
      <img src="/static/logo.png" alt="" width="56" height="56" />
    </div>
    <h1>Không âm thanh - không khoảng cách</h1>
  </header>

  <main class="layout">
    <nav class="sidebar">
      <button type="button" class="pill active" data-tab="dich">Dịch</button>
      <button type="button" class="pill" data-tab="tra">Tra cứu</button>
      <button type="button" class="pill" data-tab="luyen">Luyện</button>
    </nav>

    <section class="panel-wrap">
      <div class="panel">
        <div class="col-camera">
          <div class="video-box">
            <video id="video" playsinline muted autoplay></video>
            <canvas id="overlay"></canvas>
          </div>
        </div>
        <div class="divider"></div>
        <div class="col-text translate">
          <h2>Phiên dịch:</h2>
          <p id="output-line1">ABC</p>
          <p id="output-line2">cdscv</p>
        </div>
      </div>
    </section>
  </main>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
